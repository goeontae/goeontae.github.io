<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邹平一中人物志</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#003366',     // 古早深蓝色
                        secondary: '#0066CC',   // 标准蓝色
                        accent: '#3399FF',      // 亮蓝色
                        light: '#E6F0FF',       // 浅蓝色背景
                        dark: '#001A33',        // 最深蓝色
                    },
                    fontFamily: {
                        sans: ['SimSun', '宋体', 'Arial', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .vintage-shadow {
                box-shadow: 3px 3px 0px rgba(0, 51, 102, 0.3);
            }
            .vintage-border {
                border: 1px solid #003366;
                border-radius: 2px;
            }
            .bg-pattern {
                background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='%230066cc' fill-opacity='0.05' fill-rule='evenodd'/%3E%3C/svg%3E");
            }
        }
    </style>
</head>
<body class="bg-light bg-pattern text-dark font-sans">
    <!-- 页面头部 -->
    <header class="bg-primary text-white shadow-md">
        <div class="container mx-auto px-4 py-6">
            <div class="flex flex-col md:flex-row items-center justify-between">
                <div class="flex items-center mb-4 md:mb-0">
                    <i class="fa fa-book text-3xl mr-3"></i>
                    <h1 class="text-2xl md:text-3xl font-bold">邹平一中人物志</h1>
                </div>
                <nav class="flex space-x-6">
                    <a href="#" class="hover:text-accent transition-colors duration-300 flex items-center">
                        <i class="fa fa-home mr-1"></i> 首页
                    </a>
                    <a href="#upload" class="hover:text-accent transition-colors duration-300 flex items-center">
                        <i class="fa fa-upload mr-1"></i> 上传人物
                    </a>
                    <a href="#about" class="hover:text-accent transition-colors duration-300 flex items-center">
                        <i class="fa fa-info-circle mr-1"></i> 关于
                    </a>
                </nav>
            </div>
        </div>
    </header>

    <!-- 搜索区域 -->
    <section class="bg-secondary text-white py-4">
        <div class="container mx-auto px-4">
            <div class="max-w-2xl mx-auto">
                <div class="flex">
                    <input type="text" id="searchInput" placeholder="搜索人物姓名、班级或事迹..." 
                        class="flex-1 px-4 py-2 vintage-border focus:outline-none focus:ring-2 focus:ring-accent">
                    <button id="searchBtn" class="ml-2 bg-primary hover:bg-dark text-white px-4 py-2 transition-colors duration-300 vintage-border">
                        <i class="fa fa-search mr-1"></i> 搜索
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- 主要内容区 -->
    <main class="container mx-auto px-4 py-8">
        <!-- 人物列表 -->
        <section class="mb-12">
            <h2 class="text-2xl font-bold mb-6 text-primary border-b-2 border-secondary pb-2">
                <i class="fa fa-users mr-2"></i> 人物名录
            </h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="personList">
                <!-- 人物卡片会通过JavaScript动态加载 -->
                <div class="text-center text-gray-500 py-12" id="loadingIndicator">
                    <i class="fa fa-circle-o-notch fa-spin text-3xl mb-2"></i>
                    <p>加载人物信息中...</p>
                </div>
            </div>
        </section>

        <!-- 上传区域 -->
        <section id="upload" class="bg-white p-6 rounded vintage-shadow mb-12">
            <h2 class="text-2xl font-bold mb-6 text-primary border-b-2 border-secondary pb-2">
                <i class="fa fa-plus-circle mr-2"></i> 上传人物信息
            </h2>
            
            <form id="uploadForm" enctype="multipart/form-data" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="name" class="block text-primary font-semibold mb-1">姓名 <span class="text-red-500">*</span></label>
                        <input type="text" id="name" name="name" required
                            class="w-full px-3 py-2 vintage-border focus:outline-none focus:ring-2 focus:ring-accent">
                    </div>
                    
                    <div>
                        <label for="gradYear" class="block text-primary font-semibold mb-1">毕业年份 <span class="text-red-500">*</span></label>
                        <input type="text" id="gradYear" name="gradYear" placeholder="例如：2005" required
                            class="w-full px-3 py-2 vintage-border focus:outline-none focus:ring-2 focus:ring-accent">
                    </div>
                    
                    <div>
                        <label for="className" class="block text-primary font-semibold mb-1">班级</label>
                        <input type="text" id="className" name="className" placeholder="例如：高三(1)班"
                            class="w-full px-3 py-2 vintage-border focus:outline-none focus:ring-2 focus:ring-accent">
                    </div>
                    
                    <div>
                        <label for="category" class="block text-primary font-semibold mb-1">类别 <span class="text-red-500">*</span></label>
                        <select id="category" name="category" required
                            class="w-full px-3 py-2 vintage-border focus:outline-none focus:ring-2 focus:ring-accent">
                            <option value="">请选择类别</option>
                            <option value="校友风采">校友风采</option>
                            <option value="教师楷模">教师楷模</option>
                            <option value="学子榜样">学子榜样</option>
                            <option value="其他">其他</option>
                        </select>
                    </div>
                    
                    <div class="md:col-span-2">
                        <label for="photo" class="block text-primary font-semibold mb-1">照片</label>
                        <input type="file" id="photo" name="photo" accept="image/*"
                            class="w-full px-3 py-2 vintage-border focus:outline-none focus:ring-2 focus:ring-accent">
                        <p class="text-sm text-gray-500 mt-1">支持JPG、PNG格式，文件大小不超过5MB</p>
                    </div>
                    
                    <div class="md:col-span-2">
                        <label for="achievement" class="block text-primary font-semibold mb-1">主要事迹/成就 <span class="text-red-500">*</span></label>
                        <textarea id="achievement" name="achievement" rows="6" required
                            class="w-full px-3 py-2 vintage-border focus:outline-none focus:ring-2 focus:ring-accent"
                            placeholder="请简要介绍该人物的主要事迹、成就或贡献..."></textarea>
                    </div>
                </div>
                
                <div class="text-center">
                    <button type="submit" class="bg-primary hover:bg-dark text-white px-6 py-3 vintage-border transition-all duration-300 transform hover:scale-105">
                        <i class="fa fa-save mr-1"></i> 保存人物信息
                    </button>
                </div>
            </form>
            
            <!-- 提交结果提示 -->
            <div id="submitResult" class="mt-4 hidden"></div>
        </section>

        <!-- 关于区域 -->
        <section id="about" class="bg-white p-6 rounded vintage-shadow">
            <h2 class="text-2xl font-bold mb-6 text-primary border-b-2 border-secondary pb-2">
                <i class="fa fa-info-circle mr-2"></i> 关于邹平一中人物志
            </h2>
            
            <div class="prose max-w-none">
                <p class="mb-4">邹平一中人物志旨在记录和展示学校历年来的优秀师生事迹，传承和弘扬学校优良传统，激励在校师生奋发向上。</p>
                <p class="mb-4">本网站收集整理邹平一中各时期的杰出校友、优秀教师和学子榜样的事迹，为学校历史保存珍贵资料，为后人提供学习榜样。</p>
                <p>欢迎广大师生、校友提供更多人物线索和资料，共同丰富邹平一中的人物宝库。</p>
            </div>
        </section>
    </main>

    <!-- 页脚 -->
    <footer class="bg-primary text-white py-6 mt-12">
        <div class="container mx-auto px-4 text-center">
            <p class="mb-2">© 2023 邹平一中人物志 - 记录岁月足迹，传承一中精神</p>
            <p class="text-sm text-light/80">本网站仅作学习交流使用</p>
        </div>
    </footer>

    <!-- 人物详情模态框 -->
    <div id="personModal" class="fixed inset-0 bg-dark/70 flex items-center justify-center z-50 hidden">
        <div class="bg-white w-full max-w-4xl max-h-[90vh] overflow-y-auto rounded vintage-shadow p-6 relative">
            <button id="closeModal" class="absolute top-4 right-4 text-gray-500 hover:text-primary text-xl">
                <i class="fa fa-times"></i>
            </button>
            
            <div id="modalContent" class="space-y-4">
                <!-- 模态框内容会通过JavaScript动态加载 -->
            </div>
        </div>
    </div>

    <script>
        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            // 加载人物列表
            loadPersonList();
            
            // 搜索功能
            document.getElementById('searchBtn').addEventListener('click', function() {
                searchPersons();
            });
            
            document.getElementById('searchInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    searchPersons();
                }
            });
            
            // 表单提交处理
            document.getElementById('uploadForm').addEventListener('submit', function(e) {
                e.preventDefault();
                submitPersonForm();
            });
            
            // 关闭模态框
            document.getElementById('closeModal').addEventListener('click', function() {
                document.getElementById('personModal').classList.add('hidden');
            });
            
            // 点击模态框外部关闭
            document.getElementById('personModal').addEventListener('click', function(e) {
                if (e.target === this) {
                    this.classList.add('hidden');
                }
            });
        });
        
        // 加载人物列表
        function loadPersonList() {
            fetch('get_persons.php')
                .then(response => response.json())
                .then(data => {
                    const personList = document.getElementById('personList');
                    personList.innerHTML = '';
                    
                    if (data.length === 0) {
                        personList.innerHTML = `
                            <div class="col-span-full text-center text-gray-500 py-12">
                                <i class="fa fa-folder-open-o text-3xl mb-2"></i>
                                <p>暂无人物信息，请上传人物数据</p>
                            </div>
                        `;
                        return;
                    }
                    
                    // 按毕业年份倒序排列
                    data.sort((a, b) => b.gradYear - a.gradYear);
                    
                    data.forEach(person => {
                        const personCard = document.createElement('div');
                        personCard.className = 'bg-white rounded vintage-shadow overflow-hidden transform transition-all duration-300 hover:scale-[1.02] hover:shadow-lg';
                        personCard.innerHTML = `
                            <div class="h-48 overflow-hidden bg-light">
                                <img src="${person.photo ? person.photo : 'images/default.jpg'}" 
                                     alt="${person.name}" 
                                     class="w-full h-full object-cover transition-transform duration-500 hover:scale-110">
                            </div>
                            <div class="p-4">
                                <div class="flex justify-between items-start mb-2">
                                    <h3 class="text-xl font-bold text-primary">${person.name}</h3>
                                    <span class="bg-secondary text-white text-sm px-2 py-1 rounded">${person.gradYear}届</span>
                                </div>
                                <p class="text-gray-600 text-sm mb-2">${person.className || '班级不详'}</p>
                                <p class="text-gray-700 text-sm mb-4 line-clamp-2">${person.achievement.substring(0, 80)}${person.achievement.length > 80 ? '...' : ''}</p>
                                <div class="flex justify-between items-center">
                                    <span class="text-xs bg-light text-primary px-2 py-1 rounded">${person.category}</span>
                                    <button onclick="showPersonDetail('${person.id}')" 
                                            class="text-secondary hover:text-primary transition-colors">
                                        查看详情 <i class="fa fa-angle-right"></i>
                                    </button>
                                </div>
                            </div>
                        `;
                        personList.appendChild(personCard);
                    });
                })
                .catch(error => {
                    console.error('Error loading persons:', error);
                    document.getElementById('personList').innerHTML = `
                        <div class="col-span-full text-center text-red-500 py-12">
                            <i class="fa fa-exclamation-triangle text-3xl mb-2"></i>
                            <p>加载失败，请稍后重试</p>
                        </div>
                    `;
                });
        }
        
        // 搜索人物
        function searchPersons() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            
            if (!searchTerm) {
                loadPersonList();
                return;
            }
            
            fetch('get_persons.php')
                .then(response => response.json())
                .then(data => {
                    const personList = document.getElementById('personList');
                    personList.innerHTML = '';
                    
                    const filtered = data.filter(person => {
                        return person.name.toLowerCase().includes(searchTerm) ||
                               person.className.toLowerCase().includes(searchTerm) ||
                               person.achievement.toLowerCase().includes(searchTerm) ||
                               person.gradYear.toString().includes(searchTerm) ||
                               person.category.toLowerCase().includes(searchTerm);
                    });
                    
                    if (filtered.length === 0) {
                        personList.innerHTML = `
                            <div class="col-span-full text-center text-gray-500 py-12">
                                <i class="fa fa-search text-3xl mb-2"></i>
                                <p>没有找到匹配的人物信息</p>
                            </div>
                        `;
                        return;
                    }
                    
                    filtered.forEach(person => {
                        const personCard = document.createElement('div');
                        personCard.className = 'bg-white rounded vintage-shadow overflow-hidden transform transition-all duration-300 hover:scale-[1.02] hover:shadow-lg';
                        personCard.innerHTML = `
                            <div class="h-48 overflow-hidden bg-light">
                                <img src="${person.photo ? person.photo : 'images/default.jpg'}" 
                                     alt="${person.name}" 
                                     class="w-full h-full object-cover transition-transform duration-500 hover:scale-110">
                            </div>
                            <div class="p-4">
                                <div class="flex justify-between items-start mb-2">
                                    <h3 class="text-xl font-bold text-primary">${person.name}</h3>
                                    <span class="bg-secondary text-white text-sm px-2 py-1 rounded">${person.gradYear}届</span>
                                </div>
                                <p class="text-gray-600 text-sm mb-2">${person.className || '班级不详'}</p>
                                <p class="text-gray-700 text-sm mb-4 line-clamp-2">${person.achievement.substring(0, 80)}${person.achievement.length > 80 ? '...' : ''}</p>
                                <div class="flex justify-between items-center">
                                    <span class="text-xs bg-light text-primary px-2 py-1 rounded">${person.category}</span>
                                    <button onclick="showPersonDetail('${person.id}')" 
                                            class="text-secondary hover:text-primary transition-colors">
                                        查看详情 <i class="fa fa-angle-right"></i>
                                    </button>
                                </div>
                            </div>
                        `;
                        personList.appendChild(personCard);
                    });
                })
                .catch(error => {
                    console.error('Error searching persons:', error);
                });
        }
        
        // 显示人物详情
        function showPersonDetail(id) {
            fetch('get_persons.php?id=' + id)
                .then(response => response.json())
                .then(person => {
                    if (!person) {
                        alert('未找到该人物信息');
                        return;
                    }
                    
                    const modalContent = document.getElementById('modalContent');
                    modalContent.innerHTML = `
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div class="md:col-span-1">
                                <div class="bg-light rounded overflow-hidden vintage-border">
                                    <img src="${person.photo ? person.photo : 'images/default.jpg'}" 
                                         alt="${person.name}" 
                                         class="w-full h-auto">
                                </div>
                            </div>
                            <div class="md:col-span-2">
                                <h2 class="text-2xl font-bold text-primary mb-2">${person.name}</h2>
                                <div class="flex flex-wrap gap-2 mb-4">
                                    <span class="bg-secondary text-white text-sm px-2 py-1 rounded">${person.gradYear}届</span>
                                    <span class="bg-light text-primary text-sm px-2 py-1 rounded">${person.category}</span>
                                    ${person.className ? `<span class="bg-accent/20 text-primary text-sm px-2 py-1 rounded">${person.className}</span>` : ''}
                                </div>
                                <div>
                                    <h3 class="text-lg font-semibold text-primary mb-2 border-b border-light pb-1">主要事迹/成就</h3>
                                    <p class="text-gray-700 leading-relaxed whitespace-pre-line">${person.achievement}</p>
                                </div>
                                <div class="mt-4 text-sm text-gray-500">
                                    <p>记录时间: ${new Date(person.timestamp).toLocaleString()}</p>
                                </div>
                            </div>
                        </div>
                    `;
                    
                    document.getElementById('personModal').classList.remove('hidden');
                })
                .catch(error => {
                    console.error('Error loading person detail:', error);
                    alert('加载详情失败');
                });
        }
        
        // 提交人物表单
        function submitPersonForm() {
            const form = document.getElementById('uploadForm');
            const formData = new FormData(form);
            const resultDiv = document.getElementById('submitResult');
            
            // 显示加载状态
            resultDiv.innerHTML = `
                <div class="text-center py-3 text-gray-600">
                    <i class="fa fa-circle-o-notch fa-spin mr-2"></i> 正在提交...
                </div>
            `;
            resultDiv.classList.remove('hidden');
            resultDiv.classList.remove('bg-green-100', 'bg-red-100', 'text-green-800', 'text-red-800');
            
            fetch('save_person.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    resultDiv.innerHTML = `
                        <div class="text-center py-3">
                            <i class="fa fa-check-circle text-green-500 mr-2"></i> ${data.message}
                        </div>
                    `;
                    resultDiv.classList.add('bg-green-100', 'text-green-800');
                    
                    // 重置表单
                    form.reset();
                    
                    // 重新加载人物列表
                    loadPersonList();
                    
                    // 3秒后隐藏提示
                    setTimeout(() => {
                        resultDiv.classList.add('hidden');
                    }, 3000);
                } else {
                    resultDiv.innerHTML = `
                        <div class="text-center py-3">
                            <i class="fa fa-exclamation-circle text-red-500 mr-2"></i> ${data.message}
                        </div>
                    `;
                    resultDiv.classList.add('bg-red-100', 'text-red-800');
                }
            })
            .catch(error => {
                console.error('Error submitting form:', error);
                resultDiv.innerHTML = `
                    <div class="text-center py-3">
                        <i class="fa fa-exclamation-circle text-red-500 mr-2"></i> 提交失败，请稍后重试
                    </div>
                `;
                resultDiv.classList.add('bg-red-100', 'text-red-800');
            });
        }
    </script>
</body>
</html>
