<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邹平一中人物志</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <style>
        /* 基础样式 */
        body {
            font-family: "SimSun", "宋体", serif;
            background-color: #f0f5f9;
            color: #000;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        
        .container {
            width: 95%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 15px;
        }
        
        /* 头部样式 */
        header {
            background-color: #003366;
            color: white;
            padding: 15px 0;
            border-bottom: 3px solid #ffcc00;
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .school-name {
            font-size: 24px;
            font-weight: bold;
        }
        
        .nav-links {
            display: flex;
            gap: 20px;
        }
        
        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 5px 10px;
            border-radius: 3px;
            transition: background-color 0.3s;
        }
        
        .nav-links a:hover {
            background-color: #005299;
        }
        
        /* 主体内容 */
        main {
            padding: 20px 0;
        }
        
        .section-title {
            color: #003366;
            border-bottom: 2px solid #003366;
            padding-bottom: 10px;
            margin: 20px 0;
            font-size: 20px;
        }
        
        /* 人物展示区 */
        .persons-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .person-card {
            background-color: white;
            border: 1px solid #ccdbe8;
            padding: 15px;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .person-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .person-photo {
            width: 120px;
            height: 160px;
            margin: 0 auto 10px;
            background-color: #e6edf3;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid #99b3cc;
        }
        
        .person-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .person-name {
            font-weight: bold;
            color: #003366;
            margin: 5px 0;
        }
        
        .person-info {
            font-size: 14px;
            color: #333;
            text-align: left;
        }
        
        /* 上传区域 */
        .upload-section {
            background-color: white;
            border: 1px solid #ccdbe8;
            padding: 20px;
            margin-bottom: 30px;
        }
        
        .upload-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .form-group {
            margin-bottom: 10px;
        }
        
        .form-group.full-width {
            grid-column: 1 / -1;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #003366;
        }
        
        input, select, textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #99b3cc;
            border-radius: 3px;
            font-family: "SimSun", "宋体", serif;
        }
        
        button {
            background-color: #003366;
            color: white;
            border: none;
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 3px;
            font-family: "SimSun", "宋体", serif;
        }
        
        button:hover {
            background-color: #005299;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 15px;
        }
        
        /* 预览区域 */
        .preview-section {
            background-color: #e6edf3;
            border: 1px solid #99b3cc;
            padding: 15px;
            margin-top: 20px;
            display: none;
        }
        
        .preview-title {
            color: #003366;
            margin-top: 0;
            font-size: 18px;
        }
        
        /* 页脚 */
        footer {
            background-color: #003366;
            color: white;
            text-align: center;
            padding: 15px 0;
            margin-top: 30px;
            font-size: 14px;
        }
        
        /* 响应式调整 */
        @media (max-width: 768px) {
            .upload-form {
                grid-template-columns: 1fr;
            }
            
            .header-content {
                flex-direction: column;
                text-align: center;
            }
            
            .nav-links {
                margin-top: 10px;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container header-content">
            <div class="school-name">邹平第一中学人物志</div>
            <nav class="nav-links">
                <a href="#home"><i class="fa fa-home"></i> 首页</a>
                <a href="#persons"><i class="fa fa-users"></i> 人物展示</a>
                <a href="#upload"><i class="fa fa-upload"></i> 上传人物</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section id="home">
            <h2 class="section-title">欢迎访问邹平一中人物志</h2>
            <p>本网站记录邹平一中历届优秀师生的事迹，展示校友风采，传承学校精神。</p>
            <p>您可以浏览已收录的人物信息，也可以上传您所了解的优秀人物事迹。</p>
        </section>

        <section id="persons">
            <h2 class="section-title">人物展示</h2>
            <div class="persons-container" id="personsContainer">
                <!-- 初始状态为空，上传后会动态添加内容 -->
                <div style="grid-column: 1 / -1; text-align: center; padding: 30px; color: #666;">
                    暂无人物信息，请上传人物数据
                </div>
            </div>
        </section>

        <section id="upload" class="upload-section">
            <h2 class="section-title">上传人物信息</h2>
            <form id="personForm" class="upload-form">
                <div class="form-group">
                    <label for="name">姓名 *</label>
                    <input type="text" id="name" required>
                </div>
                
                <div class="form-group">
                    <label for="graduationYear">毕业年份 *</label>
                    <input type="text" id="graduationYear" placeholder="例如：1985届" required>
                </div>
                
                <div class="form-group">
                    <label for="major">专业/领域</label>
                    <input type="text" id="major">
                </div>
                
                <div class="form-group">
                    <label for="occupation">职业</label>
                    <input type="text" id="occupation">
                </div>
                
                <div class="form-group full-width">
                    <label for="achievement">主要成就 *</label>
                    <textarea id="achievement" rows="3" required></textarea>
                </div>
                
                <div class="form-group full-width">
                    <label for="photo">上传照片</label>
                    <input type="file" id="photo" accept="image/*">
                </div>
                
                <div class="form-group full-width button-group">
                    <button type="button" id="previewBtn">预览</button>
                    <button type="submit">保存人物</button>
                </div>
            </form>
            
            <!-- 预览区域 -->
            <div class="preview-section" id="previewSection">
                <h3 class="preview-title">预览</h3>
                <div class="person-card" id="previewCard">
                    <div class="person-photo" id="previewPhoto">
                        <i class="fa fa-user fa-3x" style="color: #666;"></i>
                    </div>
                    <div class="person-name" id="previewName">姓名</div>
                    <div class="person-info">
                        <p><strong>毕业年份：</strong><span id="previewGraduation">--</span></p>
                        <p><strong>专业/领域：</strong><span id="previewMajor">--</span></p>
                        <p><strong>职业：</strong><span id="previewOccupation">--</span></p>
                        <p><strong>主要成就：</strong><span id="previewAchievement">--</span></p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>邹平第一中学人物志 &copy; 2023 版权所有</p>
            <p>联系电话：0543-XXXXXXX</p>
        </div>
    </footer>

    <script>
        // 预览功能
        document.getElementById('previewBtn').addEventListener('click', function() {
            const name = document.getElementById('name').value;
            const graduationYear = document.getElementById('graduationYear').value;
            const major = document.getElementById('major').value;
            const occupation = document.getElementById('occupation').value;
            const achievement = document.getElementById('achievement').value;
            const photoInput = document.getElementById('photo');
            
            // 简单验证
            if (!name || !graduationYear || !achievement) {
                alert('请填写带*的必填项');
                return;
            }
            
            // 更新预览内容
            document.getElementById('previewName').textContent = name;
            document.getElementById('previewGraduation').textContent = graduationYear;
            document.getElementById('previewMajor').textContent = major || '--';
            document.getElementById('previewOccupation').textContent = occupation || '--';
            document.getElementById('previewAchievement').textContent = achievement;
            
            // 处理照片预览
            const previewPhoto = document.getElementById('previewPhoto');
            if (photoInput.files && photoInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    previewPhoto.innerHTML = `<img src="${e.target.result}" alt="${name}">`;
                }
                reader.readAsDataURL(photoInput.files[0]);
            } else {
                previewPhoto.innerHTML = '<i class="fa fa-user fa-3x" style="color: #666;"></i>';
            }
            
            // 显示预览区域
            document.getElementById('previewSection').style.display = 'block';
        });
        
        // 表单提交处理
        document.getElementById('personForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const graduationYear = document.getElementById('graduationYear').value;
            const major = document.getElementById('major').value;
            const occupation = document.getElementById('occupation').value;
            const achievement = document.getElementById('achievement').value;
            const photoInput = document.getElementById('photo');
            
            // 验证
            if (!name || !graduationYear || !achievement) {
                alert('请填写带*的必填项');
                return;
            }
            
            // 创建新人物卡片
            const personsContainer = document.getElementById('personsContainer');
            
            // 如果是第一个人物，清除"暂无人物"提示
            if (personsContainer.querySelector('div[style*="grid-column: 1 / -1"]')) {
                personsContainer.innerHTML = '';
            }
            
            // 创建卡片元素
            const card = document.createElement('div');
            card.className = 'person-card';
            
            // 处理照片
            let photoHtml = '<i class="fa fa-user fa-3x" style="color: #666;"></i>';
            if (photoInput.files && photoInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = card.querySelector('.person-photo');
                    img.innerHTML = `<img src="${e.target.result}" alt="${name}">`;
                }
                reader.readAsDataURL(photoInput.files[0]);
            }
            
            // 设置卡片内容
            card.innerHTML = `
                <div class="person-photo">
                    ${photoHtml}
                </div>
                <div class="person-name">${name}</div>
                <div class="person-info">
                    <p><strong>毕业年份：</strong>${graduationYear}</p>
                    <p><strong>专业/领域：</strong>${major || '--'}</p>
                    <p><strong>职业：</strong>${occupation || '--'}</p>
                    <p><strong>主要成就：</strong>${achievement.substring(0, 50)}${achievement.length > 50 ? '...' : ''}</p>
                </div>
            `;
            
            // 添加到容器
            personsContainer.appendChild(card);
            
            // 重置表单
            this.reset();
            document.getElementById('previewSection').style.display = 'none';
            
            alert('人物信息已成功添加！');
        });
    </script>
</body>
</html>
